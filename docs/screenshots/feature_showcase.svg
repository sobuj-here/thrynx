<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680">
  <defs>
    <linearGradient id="panelBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141D2E"/>
      <stop offset="100%" stop-color="#0A101C"/>
    </linearGradient>
    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#2979FF"/>
    </linearGradient>
    <linearGradient id="purpleAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C4DFF"/>
      <stop offset="100%" stop-color="#FF3366"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="680" fill="#070B14"/>

  <!-- Title Banner -->
  <text x="600" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">THRYNX CORE CAPABILITIES SHOWCASE</text>
  <text x="600" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#00E5FF" text-anchor="middle" letter-spacing="3">PLAY • CREATE • EDIT</text>

  <!-- Panel 1: Advanced Video Player -->
  <g transform="translate(60, 110)">
    <rect width="520" height="240" rx="16" fill="url(#panelBg)" stroke="#1F2D44" stroke-width="2"/>
    <text x="24" y="38" font-family="sans-serif" font-size="18" font-weight="800" fill="#00E5FF">1. Advanced Video Player</text>
    <text x="24" y="60" font-family="sans-serif" font-size="12" fill="#94A3B8">Media3 ExoPlayer • Seamless Audio &amp; Subtitle Switching • Background Audio</text>
    
    <!-- Video Canvas Mockup -->
    <rect x="24" y="76" width="220" height="140" rx="10" fill="#050811" stroke="#25354F"/>
    <circle cx="134" cy="146" r="20" fill="#00E5FF"/>
    <polygon points="130,138 142,146 130,154" fill="#070B14"/>
    <text x="34" y="200" font-family="sans-serif" font-size="10" fill="#E2E8F0">1080p • 60 FPS • PiP Ready</text>

    <!-- Track List Preview -->
    <rect x="260" y="76" width="236" height="140" rx="10" fill="#0D1524" stroke="#223048"/>
    <text x="274" y="100" font-family="sans-serif" font-size="11" font-weight="700" fill="#E2E8F0">Audio Languages (Real-Time):</text>
    
    <rect x="274" y="112" width="208" height="26" rx="6" fill="#00E5FF" opacity="0.2"/>
    <text x="286" y="129" font-family="sans-serif" font-size="10" font-weight="700" fill="#00E5FF">✔ English (Original Track)</text>

    <rect x="274" y="144" width="208" height="26" rx="6" fill="#152033"/>
    <text x="286" y="161" font-family="sans-serif" font-size="10" font-weight="500" fill="#E2E8F0">বাংলা (Bangla Dubbing)</text>

    <text x="274" y="196" font-family="sans-serif" font-size="10" fill="#64748B">Swipe left for Brightness • right for Volume</text>
  </g>

  <!-- Panel 2: Multi-Track Creative Video Editor -->
  <g transform="translate(620, 110)">
    <rect width="520" height="240" rx="16" fill="url(#panelBg)" stroke="#1F2D44" stroke-width="2"/>
    <text x="24" y="38" font-family="sans-serif" font-size="18" font-weight="800" fill="#2979FF">2. Creative Video Studio</text>
    <text x="24" y="60" font-family="sans-serif" font-size="12" fill="#94A3B8">CapCut-Grade Multi-Track Timeline • Keyframe Interpolator • Color Grading</text>

    <!-- Multi-track Preview -->
    <rect x="24" y="76" width="472" height="140" rx="10" fill="#0A111E" stroke="#223048"/>
    <!-- Tracks -->
    <rect x="36" y="88" width="50" height="22" rx="4" fill="#141E30"/>
    <text x="44" y="103" font-family="sans-serif" font-size="10" font-weight="700" fill="#64748B">VIDEO</text>
    <rect x="94" y="88" width="140" height="22" rx="4" fill="#2979FF"/>
    <rect x="240" y="88" width="160" height="22" rx="4" fill="#00E5FF"/>

    <rect x="36" y="116" width="50" height="22" rx="4" fill="#141E30"/>
    <text x="44" y="131" font-family="sans-serif" font-size="10" font-weight="700" fill="#64748B">AUDIO</text>
    <rect x="94" y="116" width="350" height="22" rx="4" fill="#7C4DFF"/>

    <rect x="36" y="144" width="50" height="22" rx="4" fill="#141E30"/>
    <text x="44" y="159" font-family="sans-serif" font-size="10" font-weight="700" fill="#64748B">TEXT</text>
    <rect x="140" y="144" width="180" height="22" rx="4" fill="#00E676"/>
    <text x="150" y="159" font-family="sans-serif" font-size="10" font-weight="700" fill="#070B14">বাংলা সাবটাইটেল / Titles</text>

    <!-- Playhead Needle -->
    <line x1="220" y1="76" x2="220" y2="216" stroke="#FF3366" stroke-width="2"/>

    <!-- Bottom Action Pill Bar -->
    <text x="36" y="196" font-family="sans-serif" font-size="10" font-weight="700" fill="#00E5FF">Split • Trim • Speed (0.25x-4x) • Keyframes • Transitions • Shaders</text>
  </g>

  <!-- Panel 3: Music Studio & Visualizer -->
  <g transform="translate(60, 380)">
    <rect width="520" height="240" rx="16" fill="url(#panelBg)" stroke="#1F2D44" stroke-width="2"/>
    <text x="24" y="38" font-family="sans-serif" font-size="18" font-weight="800" fill="#7C4DFF">3. Music Studio &amp; Audio Visualizer</text>
    <text x="24" y="60" font-family="sans-serif" font-size="12" fill="#94A3B8">Local Library • Sleep Timer • Queue Manager • Lockscreen Media Controls</text>

    <rect x="24" y="76" width="472" height="140" rx="10" fill="#0B1220" stroke="#223048"/>
    <!-- Live Waveform Visualizer Bars -->
    <g transform="translate(40, 100)">
      <rect x="0" y="20" width="8" height="40" rx="4" fill="#00E5FF"/>
      <rect x="14" y="10" width="8" height="50" rx="4" fill="#2979FF"/>
      <rect x="28" y="5" width="8" height="55" rx="4" fill="#7C4DFF"/>
      <rect x="42" y="18" width="8" height="42" rx="4" fill="#00E5FF"/>
      <rect x="56" y="2" width="8" height="58" rx="4" fill="#FF3366"/>
      <rect x="70" y="12" width="8" height="48" rx="4" fill="#00E5FF"/>
      <rect x="84" y="25" width="8" height="35" rx="4" fill="#2979FF"/>
      <rect x="98" y="8" width="8" height="52" rx="4" fill="#7C4DFF"/>
      <rect x="112" y="15" width="8" height="45" rx="4" fill="#00E5FF"/>
      <rect x="126" y="30" width="8" height="30" rx="4" fill="#2979FF"/>
    </g>

    <!-- Song Info & Player Actions -->
    <g transform="translate(200, 100)">
      <text x="0" y="20" font-family="sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Midnight Symphony.flac</text>
      <text x="0" y="38" font-family="sans-serif" font-size="11" fill="#94A3B8">Lossless Audio • 3:45 / 4:20</text>
      
      <!-- Sleep Timer Badge -->
      <rect x="0" y="52" width="110" height="24" rx="12" fill="#1C283E"/>
      <text x="12" y="68" font-family="sans-serif" font-size="10" font-weight="600" fill="#00E5FF">⏱ Sleep: 30m</text>

      <rect x="120" y="52" width="130" height="24" rx="12" fill="#1C283E"/>
      <text x="132" y="68" font-family="sans-serif" font-size="10" font-weight="600" fill="#00E676">🎧 Background On</text>
    </g>
  </g>

  <!-- Panel 4: Photo-to-Video Slideshow Maker -->
  <g transform="translate(620, 380)">
    <rect width="520" height="240" rx="16" fill="url(#panelBg)" stroke="#1F2D44" stroke-width="2"/>
    <text x="24" y="38" font-family="sans-serif" font-size="18" font-weight="800" fill="#FF3366">4. Photo Slideshow Maker</text>
    <text x="24" y="60" font-family="sans-serif" font-size="12" fill="#94A3B8">Ken Burns Cinematic Zoom • Audio Sync • 16:9 / 9:16 / 1:1 / 4:5 Export</text>

    <rect x="24" y="76" width="472" height="140" rx="10" fill="#0B1220" stroke="#223048"/>
    <!-- Photo Slides Mockup -->
    <g transform="translate(40, 94)">
      <rect x="0" y="0" width="70" height="70" rx="8" fill="#1E2A3E" stroke="#00E5FF" stroke-width="2"/>
      <text x="14" y="40" font-family="sans-serif" font-size="11" font-weight="700" fill="#00E5FF">Slide 1</text>

      <rect x="85" y="0" width="70" height="70" rx="8" fill="#1E2A3E" stroke="#2979FF" stroke-width="1.5"/>
      <text x="99" y="40" font-family="sans-serif" font-size="11" font-weight="700" fill="#2979FF">Slide 2</text>

      <rect x="170" y="0" width="70" height="70" rx="8" fill="#1E2A3E" stroke="#7C4DFF" stroke-width="1.5"/>
      <text x="184" y="40" font-family="sans-serif" font-size="11" font-weight="700" fill="#7C4DFF">Slide 3</text>
    </g>

    <g transform="translate(300, 94)">
      <text x="0" y="20" font-family="sans-serif" font-size="11" font-weight="700" fill="#E2E8F0">Ken Burns Zoom: Enabled</text>
      <text x="0" y="38" font-family="sans-serif" font-size="11" fill="#94A3B8">Duration: 3.5s per slide</text>
      <text x="0" y="56" font-family="sans-serif" font-size="11" fill="#94A3B8">Transitions: Cross Dissolve</text>
      <rect x="0" y="70" width="130" height="28" rx="8" fill="#00E5FF"/>
      <text x="14" y="88" font-family="sans-serif" font-size="11" font-weight="800" fill="#070B14">⚡ CREATE VIDEO</text>
    </g>
  </g>
</svg>
