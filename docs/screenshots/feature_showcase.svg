<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680">
  <defs>
    <linearGradient id="panelBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141D2E"/>
      <stop offset="100%" stop-color="#0A101C"/>
    </linearGradient>
    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#2979FF"/>
    </linearGradient>
    <linearGradient id="purpleAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C4DFF"/>
      <stop offset="100%" stop-color="#FF3366"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="680" fill="#070B14"/>

  <!-- Title Banner -->
  <text x="600" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">THRYNX PROFESSIONAL VIDEO PLAYER CAPABILITIES</text>
  <text x="600" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#00E5FF" text-anchor="middle" letter-spacing="4">MX PLAYER-GRADE PLAYBACK • 100% OFFLINE-FIRST</text>

  <!-- Panel 1: Advanced Video Player & MX Gestures -->
  <g transform="translate(60, 110)">
    <rect width="520" height="250" rx="16" fill="url(#panelBg)" stroke="#1F2D44" stroke-width="2"/>
    <text x="24" y="38" font-family="sans-serif" font-size="18" font-weight="800" fill="#00E5FF">1. Advanced Player &amp; MX Gestures</text>
    <text x="24" y="60" font-family="sans-serif" font-size="12" fill="#94A3B8">Media3 ExoPlayer • Multi-Audio Switching • 4K UHD Decoding</text>
    
    <!-- Video Canvas Mockup -->
    <rect x="24" y="76" width="220" height="150" rx="10" fill="#050811" stroke="#25354F"/>
    <circle cx="134" cy="151" r="22" fill="#00E5FF"/>
    <polygon points="130,143 142,151 130,159" fill="#070B14"/>
    <text x="34" y="210" font-family="sans-serif" font-size="10" fill="#E2E8F0">4K UHD • 60 FPS • PiP Ready</text>

    <!-- Gesture Guide -->
    <rect x="260" y="76" width="236" height="150" rx="10" fill="#0D1524" stroke="#223048"/>
    <text x="274" y="98" font-family="sans-serif" font-size="11" font-weight="700" fill="#E2E8F0">Intuitive Touch Controls:</text>
    
    <rect x="274" y="108" width="208" height="24" rx="4" fill="#141E32"/>
    <text x="282" y="124" font-family="sans-serif" font-size="9" font-weight="600" fill="#00E5FF">Swipe Left: Brightness (0-100%)</text>

    <rect x="274" y="136" width="208" height="24" rx="4" fill="#141E32"/>
    <text x="282" y="152" font-family="sans-serif" font-size="9" font-weight="600" fill="#00E5FF">Swipe Right: Media Volume (0-100%)</text>

    <rect x="274" y="164" width="208" height="24" rx="4" fill="#141E32"/>
    <text x="282" y="180" font-family="sans-serif" font-size="9" font-weight="600" fill="#E2E8F0">Horizontal Swipe: Seek Timeline</text>

    <text x="274" y="210" font-family="sans-serif" font-size="9" fill="#64748B">Double Tap: ±10s Seek • Long Press: 2x Fast</text>
  </g>

  <!-- Panel 2: Subtitle Engine & Sync Delay -->
  <g transform="translate(620, 110)">
    <rect width="520" height="250" rx="16" fill="url(#panelBg)" stroke="#1F2D44" stroke-width="2"/>
    <text x="24" y="38" font-family="sans-serif" font-size="18" font-weight="800" fill="#00E5FF">2. Subtitle Engine &amp; Synchronization</text>
    <text x="24" y="60" font-family="sans-serif" font-size="12" fill="#94A3B8">Embedded &amp; External (.srt, .vtt, .ass) • Real-Time Offset Delay</text>
    
    <rect x="24" y="76" width="472" height="150" rx="10" fill="#0D1524" stroke="#223048"/>
    <!-- Subtitle Sync Controls -->
    <text x="40" y="105" font-family="sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">Real-Time Timing Delay Offset:</text>
    <rect x="40" y="118" width="58" height="28" rx="6" fill="#182338"/>
    <text x="50" y="136" font-family="sans-serif" font-size="10" font-weight="600" fill="#E2E8F0">-500ms</text>
    <rect x="106" y="118" width="58" height="28" rx="6" fill="#182338"/>
    <text x="116" y="136" font-family="sans-serif" font-size="10" font-weight="600" fill="#E2E8F0">-100ms</text>
    <rect x="172" y="118" width="60" height="28" rx="6" fill="#00E5FF" opacity="0.2"/>
    <text x="186" y="136" font-family="sans-serif" font-size="10" font-weight="700" fill="#00E5FF">0 ms</text>
    <rect x="240" y="118" width="58" height="28" rx="6" fill="#182338"/>
    <text x="250" y="136" font-family="sans-serif" font-size="10" font-weight="600" fill="#E2E8F0">+100ms</text>
    <rect x="306" y="118" width="58" height="28" rx="6" fill="#182338"/>
    <text x="316" y="136" font-family="sans-serif" font-size="10" font-weight="600" fill="#E2E8F0">+500ms</text>

    <!-- Subtitle Preview -->
    <rect x="40" y="160" width="440" height="48" rx="8" fill="#060A12" stroke="#1D2A40"/>
    <text x="260" y="190" font-family="sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">
      "THRYNX provides crystal clear subtitle rendering."
    </text>
  </g>

  <!-- Panel 3: Video Library & Folder Hierarchy -->
  <g transform="translate(60, 390)">
    <rect width="520" height="240" rx="16" fill="url(#panelBg)" stroke="#1F2D44" stroke-width="2"/>
    <text x="24" y="38" font-family="sans-serif" font-size="18" font-weight="800" fill="#00E5FF">3. Video Library &amp; Organization</text>
    <text x="24" y="60" font-family="sans-serif" font-size="12" fill="#94A3B8">Grid &amp; List Views • Multi-Sort • Duration Filtering • Metadata</text>
    
    <rect x="24" y="76" width="472" height="140" rx="10" fill="#0D1524" stroke="#223048"/>
    <!-- Folders preview -->
    <rect x="40" y="92" width="138" height="50" rx="8" fill="#162238"/>
    <text x="52" y="112" font-family="sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">Movies</text>
    <text x="52" y="128" font-family="sans-serif" font-size="9" fill="#00E5FF">24 Videos • 4K</text>

    <rect x="190" y="92" width="138" height="50" rx="8" fill="#162238"/>
    <text x="202" y="112" font-family="sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">Downloads</text>
    <text x="202" y="128" font-family="sans-serif" font-size="9" fill="#00E5FF">18 Videos • 1080p</text>

    <rect x="340" y="92" width="138" height="50" rx="8" fill="#162238"/>
    <text x="352" y="112" font-family="sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">Camera</text>
    <text x="352" y="128" font-family="sans-serif" font-size="9" fill="#00E5FF">42 Videos • FHD</text>

    <!-- Filter chips preview -->
    <text x="40" y="172" font-family="sans-serif" font-size="10" font-weight="600" fill="#E2E8F0">Filter by Duration:</text>
    <rect x="150" y="158" width="55" height="22" rx="11" fill="#00E5FF" opacity="0.2"/>
    <text x="160" y="172" font-family="sans-serif" font-size="9" font-weight="700" fill="#00E5FF">All</text>
    <rect x="215" y="158" width="70" height="22" rx="11" fill="#182338"/>
    <text x="225" y="172" font-family="sans-serif" font-size="9" fill="#E2E8F0">&lt; 2 mins</text>
    <rect x="295" y="158" width="75" height="22" rx="11" fill="#182338"/>
    <text x="305" y="172" font-family="sans-serif" font-size="9" fill="#E2E8F0">2-10 mins</text>
    <rect x="380" y="158" width="75" height="22" rx="11" fill="#182338"/>
    <text x="390" y="172" font-family="sans-serif" font-size="9" fill="#E2E8F0">&gt; 10 mins</text>
  </g>

  <!-- Panel 4: Private Vault & 100% Offline Privacy -->
  <g transform="translate(620, 390)">
    <rect width="520" height="240" rx="16" fill="url(#panelBg)" stroke="#1F2D44" stroke-width="2"/>
    <text x="24" y="38" font-family="sans-serif" font-size="18" font-weight="800" fill="#00E5FF">4. Private Vault &amp; Complete Security</text>
    <text x="24" y="60" font-family="sans-serif" font-size="12" fill="#94A3B8">PIN Protected Storage • Hidden From Library • Zero Telemetry</text>
    
    <rect x="24" y="76" width="472" height="140" rx="10" fill="#0D1524" stroke="#223048"/>
    <!-- Vault Card -->
    <rect x="40" y="94" width="440" height="52" rx="8" fill="#121B2C" stroke="#00E5FF" stroke-width="1.2"/>
    <circle cx="70" cy="120" r="14" fill="#00E5FF" opacity="0.2"/>
    <text x="95" y="114" font-family="sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">Private Video Vault Active</text>
    <text x="95" y="130" font-family="sans-serif" font-size="9" fill="#00E5FF">4-Digit Security PIN • Hidden Videos are completely protected</text>

    <!-- Privacy badges -->
    <rect x="40" y="160" width="138" height="32" rx="6" fill="#182338"/>
    <text x="50" y="180" font-family="sans-serif" font-size="9" font-weight="700" fill="#00E676">✔ 100% OFFLINE</text>

    <rect x="190" y="160" width="138" height="32" rx="6" fill="#182338"/>
    <text x="200" y="180" font-family="sans-serif" font-size="9" font-weight="700" fill="#00E676">✔ ZERO TELEMETRY</text>

    <rect x="340" y="160" width="140" height="32" rx="6" fill="#182338"/>
    <text x="350" y="180" font-family="sans-serif" font-size="9" font-weight="700" fill="#00E676">✔ FILEPROVIDER SAFE</text>
  </g>
</svg>
