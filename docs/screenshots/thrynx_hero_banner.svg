<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070A12"/>
      <stop offset="50%" stop-color="#0E1626"/>
      <stop offset="100%" stop-color="#05080E"/>
    </linearGradient>

    <!-- Vibrant Cyan / Blue Accents -->
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#2979FF"/>
    </linearGradient>

    <linearGradient id="musicMeshGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1C38"/>
      <stop offset="35%" stop-color="#0A2A4A"/>
      <stop offset="70%" stop-color="#1B143A"/>
      <stop offset="100%" stop-color="#0C1527"/>
    </linearGradient>

    <linearGradient id="phoneCardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#182236"/>
      <stop offset="100%" stop-color="#0F1726"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="480" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Pattern Accent -->
  <g opacity="0.04" stroke="#00E5FF" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="150" y1="0" x2="150" y2="480"/>
    <line x1="300" y1="0" x2="300" y2="480"/>
    <line x1="450" y1="0" x2="450" y2="480"/>
    <line x1="600" y1="0" x2="600" y2="480"/>
    <line x1="750" y1="0" x2="750" y2="480"/>
    <line x1="900" y1="0" x2="900" y2="480"/>
    <line x1="1050" y1="0" x2="1050" y2="480"/>
  </g>

  <!-- Left Side: Branding, Tagline, Badges -->
  <g transform="translate(70, 75)">
    <!-- Brand Crest Symbol -->
    <g transform="translate(0, 0)">
      <polygon points="0,0 60,0 45,30 15,30" fill="#00E5FF" filter="url(#glow)"/>
      <polygon points="20,28 60,28 40,70 15,50" fill="#2979FF"/>
      <polygon points="35,32 65,50 48,80 30,62" fill="#00E5FF"/>
      <circle cx="36" cy="40" r="5" fill="#FFFFFF"/>
    </g>

    <text x="80" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="900" fill="#FFFFFF" letter-spacing="4">THRYNX</text>
    <text x="84" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#00E5FF" letter-spacing="4">NATIVE MEDIA STUDIO &amp; MUSIC DISCOVERY</text>

    <!-- Tagline description -->
    <text x="0" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#FFFFFF">
      High-Performance Video Player &amp; Audiophile Music Hub
    </text>
    <text x="0" y="162" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#CBD5E1">
      ⚡ YouTube Music Discovery • Offline Audio Downloader • Liked Tracks
    </text>
    <text x="0" y="188" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#CBD5E1">
      🎧 10-Band Parametric EQ • Synced Lyrics • Ambient Mesh Gradients
    </text>
    <text x="0" y="214" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#CBD5E1">
      📞 Smart Call &amp; Bluetooth Audio Focus • 6-Category Settings Hub
    </text>
    <text x="0" y="246" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#94A3B8">
      Dual Language: English &amp; বাংলা • Media3 ExoPlayer • Room v4 • 100% Ad-Free
    </text>

    <!-- Download Badge / CTA Button -->
    <g transform="translate(0, 275)">
      <a href="https://github.com/sobuj-here/thrynx/releases/tag/v1.2.0">
        <rect width="250" height="52" rx="26" fill="url(#cyanGlow)" filter="url(#glow)"/>
        <text x="32" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#070B14" letter-spacing="1">⚡ DOWNLOAD APK v1.2.0</text>
        <path d="M218 26 L210 20 L210 32 Z" fill="#070B14"/>
      </a>
    </g>
    
    <g transform="translate(270, 275)">
      <rect width="200" height="52" rx="26" fill="#141E30" stroke="#25354F" stroke-width="1.5"/>
      <text x="28" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#00E5FF">Release v1.2.0 (~23 MB)</text>
    </g>
  </g>

  <!-- Right Side Mockups: 2 Layered Showcase Cards -->

  <!-- Device 1: Video Player Engine (Back/Left) -->
  <g transform="translate(690, 48)">
    <rect width="220" height="390" rx="24" fill="url(#phoneCardGrad)" stroke="#223048" stroke-width="2.5"/>
    <rect x="75" y="10" width="70" height="10" rx="5" fill="#0A0E17"/>
    
    <!-- Video Player Preview Header -->
    <rect x="14" y="32" width="192" height="115" rx="10" fill="#080D18"/>
    <circle cx="110" cy="90" r="22" fill="#00E5FF" opacity="0.9" filter="url(#softGlow)"/>
    <polygon points="106,82 118,90 106,98" fill="#070B14"/>
    <text x="24" y="52" font-family="sans-serif" font-size="9" font-weight="700" fill="#00E5FF">4K HDR • 60 FPS</text>
    
    <!-- Multi-Audio Track & Network Stream Sheet -->
    <rect x="14" y="158" width="192" height="210" rx="12" fill="#111A2C" stroke="#24344E" stroke-width="1"/>
    <text x="26" y="180" font-family="sans-serif" font-size="11" font-weight="800" fill="#00E5FF">NETWORK &amp; AUDIO</text>
    
    <rect x="22" y="192" width="176" height="26" rx="6" fill="#00E5FF" opacity="0.15"/>
    <circle cx="34" cy="205" r="4" fill="#00E5FF"/>
    <text x="46" y="209" font-family="sans-serif" font-size="10" font-weight="700" fill="#00E5FF">Watch Video (ExoPlayer)</text>

    <rect x="22" y="224" width="176" height="26" rx="6" fill="#182338"/>
    <circle cx="34" cy="237" r="4" fill="#64748B"/>
    <text x="46" y="241" font-family="sans-serif" font-size="10" font-weight="500" fill="#E2E8F0">Play Audio (Background)</text>

    <rect x="22" y="256" width="176" height="26" rx="6" fill="#182338"/>
    <circle cx="34" cy="269" r="4" fill="#64748B"/>
    <text x="46" y="273" font-family="sans-serif" font-size="10" font-weight="500" fill="#E2E8F0">English &amp; বাংলা Subtitles</text>
    
    <!-- Gesture Hints Bar -->
    <rect x="22" y="292" width="176" height="60" rx="8" fill="#0A0F1D"/>
    <text x="30" y="312" font-family="sans-serif" font-size="9" fill="#94A3B8">Brightness ⮞ Swipe Left</text>
    <text x="30" y="328" font-family="sans-serif" font-size="9" fill="#94A3B8">Volume ⮞ Swipe Right</text>
    <text x="30" y="344" font-family="sans-serif" font-size="9" fill="#00E5FF">Zoom 1.0x - 4.0x Multi-Touch</text>
  </g>

  <!-- Device 2: Audiophile Music Hub & YouTube Music (Front/Right Focus) -->
  <g transform="translate(930, 40)">
    <rect width="235" height="405" rx="26" fill="url(#musicMeshGrad)" stroke="#00E5FF" stroke-width="2.5" filter="url(#glow)"/>
    <rect x="82" y="10" width="70" height="10" rx="5" fill="#0A0E17"/>

    <!-- Top Status / Header -->
    <text x="18" y="38" font-family="sans-serif" font-size="12" font-weight="800" fill="#FFFFFF">THRYNX Music</text>
    <rect x="156" y="26" width="62" height="18" rx="9" fill="#00E5FF"/>
    <text x="163" y="39" font-family="sans-serif" font-size="9" font-weight="800" fill="#070B14">ONLINE</text>

    <!-- Album Art Artwork Card with Mesh Shadow -->
    <rect x="24" y="56" width="187" height="135" rx="14" fill="#0C1A30" stroke="#00E5FF" stroke-width="1.2"/>
    <!-- Simulated Gradient Artwork -->
    <rect x="34" y="66" width="60" height="60" rx="8" fill="#00E5FF" opacity="0.3"/>
    <polygon points="56,88 72,96 56,104" fill="#00E5FF"/>
    <text x="104" y="86" font-family="sans-serif" font-size="11" font-weight="800" fill="#FFFFFF">Midnight Echoes</text>
    <text x="104" y="102" font-family="sans-serif" font-size="9" font-weight="600" fill="#00E5FF">YouTube Music</text>
    <text x="104" y="118" font-family="sans-serif" font-size="8" fill="#94A3B8">320kbps • AAC</text>

    <!-- Quick Action Chips (Heart, Download, Video) -->
    <g transform="translate(34, 140)">
      <rect width="48" height="24" rx="12" fill="#E11D48" opacity="0.2"/>
      <text x="12" y="16" font-family="sans-serif" font-size="9" font-weight="700" fill="#FB7185">❤️ Liked</text>
      
      <rect x="54" width="62" height="24" rx="12" fill="#00E5FF" opacity="0.2"/>
      <text x="63" y="16" font-family="sans-serif" font-size="9" font-weight="700" fill="#00E5FF">⬇ Offline</text>

      <rect x="122" width="55" height="24" rx="12" fill="#2979FF" opacity="0.2"/>
      <text x="130" y="16" font-family="sans-serif" font-size="9" font-weight="700" fill="#60A5FA">🎬 Video</text>
    </g>

    <!-- Synced Lyrics Section Preview -->
    <rect x="24" y="202" width="187" height="85" rx="10" fill="#0A1122" opacity="0.9"/>
    <text x="34" y="222" font-family="sans-serif" font-size="9" font-weight="500" fill="#64748B">♪ Past line fading away...</text>
    <text x="34" y="244" font-family="sans-serif" font-size="11" font-weight="800" fill="#00E5FF">♪ Stars align across the night sky</text>
    <text x="34" y="266" font-family="sans-serif" font-size="9" font-weight="500" fill="#64748B">♪ Real-time synchronized lyrics...</text>

    <!-- ThinSlider Scrubber & Equalizer -->
    <g transform="translate(24, 300)">
      <line x1="0" y1="6" x2="187" y2="6" stroke="#1E293B" stroke-width="4" stroke-linecap="round"/>
      <line x1="0" y1="6" x2="110" y2="6" stroke="#00E5FF" stroke-width="4" stroke-linecap="round"/>
      <circle cx="110" cy="6" r="6" fill="#FFFFFF" filter="url(#softGlow)"/>
      <text x="0" y="22" font-family="sans-serif" font-size="8" fill="#94A3B8">02:18</text>
      <text x="165" y="22" font-family="sans-serif" font-size="8" fill="#94A3B8">03:45</text>
    </g>

    <!-- Controls Row: Shuffle, Prev, Play, Next, EQ -->
    <g transform="translate(24, 335)">
      <circle cx="20" cy="18" r="12" fill="#182338"/>
      <text x="14" y="22" font-family="sans-serif" font-size="11" fill="#00E5FF">🔀</text>

      <circle cx="56" cy="18" r="14" fill="#182338"/>
      <polygon points="58,12 48,18 58,24" fill="#FFFFFF"/>

      <circle cx="94" cy="18" r="18" fill="#00E5FF" filter="url(#softGlow)"/>
      <polygon points="90,11 102,18 90,25" fill="#070B14"/>

      <circle cx="132" cy="18" r="14" fill="#182338"/>
      <polygon points="128,12 138,18 128,24" fill="#FFFFFF"/>

      <rect x="156" y="6" width="30" height="24" rx="6" fill="#182338"/>
      <text x="160" y="22" font-family="sans-serif" font-size="9" font-weight="700" fill="#00E676">10-EQ</text>
    </g>

    <!-- Bottom Navigation Bar representation -->
    <rect x="18" y="368" width="199" height="28" rx="8" fill="#0A0F1D"/>
    <text x="30" y="386" font-family="sans-serif" font-size="8" font-weight="600" fill="#94A3B8">Home</text>
    <text x="70" y="386" font-family="sans-serif" font-size="8" font-weight="600" fill="#94A3B8">Videos</text>
    <text x="112" y="386" font-family="sans-serif" font-size="8" font-weight="800" fill="#00E5FF">Audio</text>
    <text x="152" y="386" font-family="sans-serif" font-size="8" font-weight="600" fill="#94A3B8">Folders</text>
    <text x="188" y="386" font-family="sans-serif" font-size="8" font-weight="600" fill="#94A3B8">⚙</text>
  </g>
</svg>
